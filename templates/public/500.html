{% extends 'base_public.html' %}

{% block title %}SmartPark | 500 Server Error{% endblock %}

{% block content %}
<section class="min-h-[85vh] flex flex-col justify-center items-center bg-gray-50 border-b border-gray-200 py-24">
    <div class="max-w-3xl mx-auto px-6 text-center">
        <!-- Eyebrow -->
        <span class="block text-xs font-bold uppercase tracking-[0.2em] text-gray-400 mb-6">500 / Server Error</span>
        
        <!-- Heading -->
        <h1 class="text-4xl md:text-6xl font-bold tracking-tight text-gray-900 mb-6 leading-tight">
            Something went wrong.
        </h1>
        
        <!-- Supporting text -->
        <p class="text-lg md:text-xl text-gray-600 mb-12 max-w-xl mx-auto leading-relaxed">
            SmartPark couldn't complete your request right now. Please try again in a moment. Let's get you back to SmartPark.
        </p>

        <!-- Purposeful Visual -->
        <div class="flex justify-center items-center gap-4 mb-16 opacity-70">
            <div class="w-24 h-24 border-2 border-gray-300 rounded-lg flex items-center justify-center bg-white shadow-sm relative overflow-hidden">
                <div class="absolute inset-0 flex items-center justify-center opacity-20">
                    <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="w-2 h-16 bg-gray-200 rounded-full animate-pulse"></div>
            </div>
        </div>
        
        <!-- CTAs -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <button onclick="window.location.reload()" class="inline-flex justify-center items-center px-10 py-4 bg-gray-900 text-white rounded-full font-medium text-lg hover:bg-gray-800 transition-colors w-full sm:w-auto shadow-xl hover:shadow-2xl">
                Try Again
            </button>
            <a href="/" class="inline-flex justify-center items-center px-10 py-4 bg-white text-gray-900 border border-gray-200 rounded-full font-medium text-lg hover:bg-gray-50 transition-colors w-full sm:w-auto shadow-sm">
                Back to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
